    <radialGradient id="gp"><stop offset="0" stop-color="#ff4d8d" stop-opacity=".42"/><stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gc"><stop offset="0" stop-color="#38e8ff" stop-opacity=".30"/><stop offset="1" stop-color="#38e8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gv"><stop offset="0" stop-color="#9d7bff" stop-opacity=".34"/><stop offset="1" stop-color="#9d7bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="nameg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff4d8d"/><stop offset=".33" stop-color="#9d7bff"/><stop offset=".66" stop-color="#38e8ff"/><stop offset="1" stop-color="#b4ff39"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d8d"/><stop offset=".5" stop-color="#38e8ff"/><stop offset="1" stop-color="#b4ff39"/></linearGradient>
    <pattern id="gr" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
    <clipPath id="rc0"><rect class="rc0" x="70" y="256" width="0" height="48"/></clipPath><clipPath id="rc1"><rect class="rc1" x="70" y="256" width="0" height="48"/></clipPath><clipPath id="rc2"><rect class="rc2" x="70" y="256" width="0" height="48"/></clipPath><clipPath id="rc3"><rect class="rc3" x="70" y="256" width="0" height="48"/></clipPath><style>
    .name{font:800 88px 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;letter-spacing:-3px}
    .kick{font:500 21px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;fill:#38e8ff}
    .role{font:500 28px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;fill:#eef2f8}
    .meta{font:500 19px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;fill:#8a95a8}
    .tok{font:600 17px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;fill:#eef2f8;text-anchor:middle;dominant-baseline:central}
    .core{font:800 32px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;text-anchor:middle;dominant-baseline:central;fill:#0a0d14}
    .caret{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .b1{animation:d1 13s ease-in-out infinite alternate}
    .b2{animation:d2 17s ease-in-out infinite alternate}
    .b3{animation:d3 11s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(170px,70px)}}
    @keyframes d2{to{transform:translate(-210px,-60px)}}
    @keyframes d3{to{transform:translate(-90px,90px)}}
    .grid{animation:gm 8s linear infinite}
    @keyframes gm{to{transform:translateY(48px)}}
    .pulse{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pu{50%{transform:scale(1.5);opacity:.35}}
    .ring{transform-origin:950px 200px}
    .r1{animation:sp 24s linear infinite}
    .r2{animation:sp 36s linear infinite reverse}
    @keyframes sp{to{transform:rotate(360deg)}}
    .rise{animation:ri 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes ri{from{opacity:0;transform:translateY(20px)}}
    .rc0{animation:rc0 16s steps(36) infinite}@keyframes rc0{0%,0.00%{width:0}10.50%,22.00%{width:608.8px}25.00%,100%{width:0}}.cr0{animation:cr0 16s steps(36) infinite}@keyframes cr0{0%,0.00%{transform:translateX(0);opacity:1}0.01%{opacity:1;transform:translateX(0)}10.50%,22.00%{opacity:1;transform:translateX(608.8px)}25.00%{opacity:1;transform:translateX(0)}25.01%,100%{opacity:0;transform:translateX(0)}}.rc1{animation:rc1 16s steps(27) infinite}@keyframes rc1{0%,25.00%{width:0}35.50%,47.00%{width:457.6px}50.00%,100%{width:0}}.cr1{animation:cr1 16s steps(27) infinite}@keyframes cr1{0%,25.00%{transform:translateX(0);opacity:0}25.01%{opacity:1;transform:translateX(0)}35.50%,47.00%{opacity:1;transform:translateX(457.6px)}50.00%{opacity:1;transform:translateX(0)}50.01%,100%{opacity:0;transform:translateX(0)}}.rc2{animation:rc2 16s steps(34) infinite}@keyframes rc2{0%,50.00%{width:0}60.50%,72.00%{width:575.2px}75.00%,100%{width:0}}.cr2{animation:cr2 16s steps(34) infinite}@keyframes cr2{0%,50.00%{transform:translateX(0);opacity:0}50.01%{opacity:1;transform:translateX(0)}60.50%,72.00%{opacity:1;transform:translateX(575.2px)}75.00%{opacity:1;transform:translateX(0)}75.01%,100%{opacity:0;transform:translateX(0)}}.rc3{animation:rc3 16s steps(29) infinite}@keyframes rc3{0%,75.00%{width:0}85.50%,97.00%{width:491.2px}100.00%,100%{width:0}}.cr3{animation:cr3 16s steps(29) infinite}@keyframes cr3{0%,75.00%{transform:translateX(0);opacity:0}75.01%{opacity:1;transform:translateX(0)}85.50%,97.00%{opacity:1;transform:translateX(491.2px)}100.00%{opacity:1;transform:translateX(0)}100.01%,100%{opacity:0;transform:translateX(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
