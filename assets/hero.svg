      <g class="ring r2"><circle cx="950" cy="200" r="175" fill="none" stroke="#fff" stroke-opacity=".13" stroke-dasharray="3 9"/><g transform="translate(1125.0 200.0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><rect x="-34.6" y="-20" width="69.2" height="40" rx="12" fill="#121826" stroke="#b4ff39" stroke-width="2"/><text class="tok" fill="#b4ff39" style="fill:#b4ff39">Node</text></g></g><g transform="translate(1004.1 366.4)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><rect x="-29.2" y="-20" width="58.4" height="40" rx="12" fill="#121826" stroke="#ff4d8d" stroke-width="2"/><text class="tok" fill="#ff4d8d" style="fill:#ff4d8d">API</text></g></g><g transform="translate(808.4 302.9)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><rect x="-40.0" y="-20" width="80.0" height="40" rx="12" fill="#121826" stroke="#38e8ff" stroke-width="2"/><text class="tok" fill="#38e8ff" style="fill:#38e8ff">React</text></g></g><g transform="translate(808.4 97.1)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><rect x="-34.6" y="-20" width="69.2" height="40" rx="12" fill="#121826" stroke="#ff9d5c" stroke-width="2"/><text class="tok" fill="#ff9d5c" style="fill:#ff9d5c">Java</text></g></g><g transform="translate(1004.1 33.6)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/><rect x="-29.2" y="-20" width="58.4" height="40" rx="12" fill="#121826" stroke="#ff7a59" stroke-width="2"/><text class="tok" fill="#ff7a59" style="fill:#ff7a59">Git</text></g></g></g>
