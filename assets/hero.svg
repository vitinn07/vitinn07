      <g class="rise"><text class="kick" x="70" y="104" textLength="176.4" lengthAdjust="spacingAndGlyphs">// olá, eu sou</text></g>
      <g class="rise" style="animation-delay:.15s"><text class="name" x="66" y="196" fill="url(#nameg)">Victor Lucas</text></g>
      <g clip-path="url(#rc0)"><text class="role" x="70" y="290" textLength="604.8" lengthAdjust="spacingAndGlyphs">Dev full stack, com foco em back-end</text></g><g class="cr0"><rect class="caret" x="72" y="264" width="3" height="32" fill="#b4ff39"/></g><g clip-path="url(#rc1)"><text class="role" x="70" y="290" textLength="453.6" lengthAdjust="spacingAndGlyphs">Suporte de TI · Helpdesk N1</text></g><g class="cr1"><rect class="caret" x="72" y="264" width="3" height="32" fill="#b4ff39"/></g><g clip-path="url(#rc2)"><text class="role" x="70" y="290" textLength="571.2" lengthAdjust="spacingAndGlyphs">Engenharia de Software · PUC Minas</text></g><g class="cr2"><rect class="caret" x="72" y="264" width="3" height="32" fill="#b4ff39"/></g><g clip-path="url(#rc3)"><text class="role" x="70" y="290" textLength="487.2" lengthAdjust="spacingAndGlyphs">APIs, integrações e automação</text></g><g class="cr3"><rect class="caret" x="72" y="264" width="3" height="32" fill="#b4ff39"/></g>
      <g class="rise" style="animation-delay:.4s">
        <circle class="pulse" cx="79" cy="342" r="6" fill="#b4ff39"/>
