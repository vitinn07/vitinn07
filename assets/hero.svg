<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Victor Lucas (Vitinn): dev full stack com foco em back-end, suporte de TI e estudante de Engenharia de Software na PUC Minas, em Belo Horizonte."><title>Victor Lucas (Vitinn): dev full stack com foco em back-end, suporte de TI e estudante de Engenharia de Software na PUC Minas, em Belo Horizonte.</title><defs>
