<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-label="Robozinho pixel correndo sobre uma linha de código e pulando bugs."><title>Robozinho pixel correndo sobre uma linha de código e pulando bugs.</title><defs><style>
    .code{font:500 15px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;fill:#8a95a8}
