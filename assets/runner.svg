    .bot{animation:jump 6s linear infinite}
    @keyframes jump{0%,24%,39%,74%,89%,100%{transform:translateY(0)}28%,36%,78%,86%{transform:translateY(-40px)}}
    .bob{animation:bob .3s steps(2) infinite}@keyframes bob{50%{transform:translateY(-2px)}}
    .la{animation:lg .3s steps(1) infinite}.lb{animation:lg .3s steps(1) infinite reverse;animation-delay:-.15s}
    @keyframes lg{50%{transform:translateY(-5px)}}
    .bug{animation:mv 6s linear infinite}
    @keyframes mv{from{transform:translateX(1240px)}to{transform:translateX(-60px)}}
    .blink{animation:bk 1.6s steps(1) infinite}@keyframes bk{50%{opacity:.35}}
    .pop{font:700 15px 'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;fill:#b4ff39;animation:pp 6s linear infinite;opacity:0}
    @keyframes pp{0%,30%{opacity:0;transform:translateY(0)}33%{opacity:1}42%,100%{opacity:0;transform:translateY(-22px)}}
